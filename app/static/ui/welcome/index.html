<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BinaryRepair · 可验证的二进制修复</title>
  <link rel="icon" type="image/svg+xml" href="/ui/assets/mark-dark.svg">
  <link rel="stylesheet" href="/ui/welcome/welcome.css?v=20261126b">
  <link rel="stylesheet" href="/ui/shared/warp.css?v=20261121y">
  <link rel="stylesheet" href="/ui/shared/settings.css?v=20261120au">
  <link rel="stylesheet" href="/ui/shared/perf.css?v=20261120au">
  <link rel="stylesheet" href="/ui/shared/pet.css?v=20261127a">
  <script type="module" src="/ui/shared/perf.mjs?v=20261120au"></script>
  <script type="module" src="/ui/welcome/welcome.mjs?v=20261127b"></script>
  <script type="module" src="/ui/shared/pet.mjs?v=20261127a"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到主内容</a>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grid"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="/welcome">
      <span class="brand-icon" aria-hidden="true">
        <img class="mark-light" src="/ui/assets/mark-light.svg" alt="">
        <img class="mark-dark" src="/ui/assets/mark-dark.svg" alt="">
      </span>
      <strong>BinaryRepair</strong>
    </a>
    <nav class="top-actions" aria-label="Primary">
      <a class="quiet" href="/ui/" data-i18n="welcome.0" data-zh="档案库" data-en="Archive">档案库</a>
      <a class="quiet" href="/legacy" data-i18n="welcome.12" data-zh="旧版界面" data-en="Legacy GUI">旧版界面</a>
      <button class="lang" type="button" id="language" aria-label="Switch language">EN</button>
    </nav>
  </header>

  <main id="main">
    <p class="announce">
      <span class="spark" aria-hidden="true">✦</span>
      <span data-i18n="welcome.2" data-zh="本地运行 · 两条修复路线 · 一套确定性验收"
        data-en="Local session · two repair routes · one deterministic verdict">本地运行 · 两条修复路线 · 一套确定性验收</span>
    </p>

    <h1>
      <span data-i18n="welcome.3" data-zh="二进制漏洞的自动修复" data-en="Automatic repair of binary vulnerabilities">二进制漏洞的自动修复</span>
    </h1>
    <p class="lede" data-i18n="welcome.4"
      data-zh="描述一个已知漏洞，上传二进制，和修复助手一起审阅契约、运行两条路线；最终结论与证据归档在档案库。"
      data-en="Describe one known defect, attach the binary, review the contract and run both routes. The verdict and evidence are archived.">
      描述一个已知漏洞，上传二进制，和修复助手一起审阅契约、运行两条路线；最终结论与证据归档在档案库。
    </p>

    <form class="composer-card" action="/ui/chat/">
      <textarea id="draft" rows="2" maxlength="4000" aria-label="Defect description"></textarea>
      <div class="composer-bottom">
        <p id="draft-error" role="alert" hidden></p>
        <button class="send" type="submit">
          <span data-i18n="welcome.5" data-zh="进入对话" data-en="Continue to chat">Continue to chat</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </form>

    <div class="shortcuts">
      <a class="pill" href="/ui/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8m-8 4h6"/></svg>
        <span data-i18n="welcome.6" data-zh="打开档案库" data-en="Open archive">打开档案库</span>
      </a>
      <a class="pill" href="/legacy">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg>
        <span data-i18n="welcome.12" data-zh="旧版界面" data-en="Legacy GUI">旧版界面</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    <span data-i18n="welcome.9" data-zh="本地优先 · 无外部 CDN" data-en="Local-first · no external CDN">本地优先 · 无外部 CDN</span>
    <span aria-hidden="true">·</span>
    <a href="/ui/" data-i18n="welcome.10" data-zh="档案库" data-en="Archive">档案库</a>
    <span aria-hidden="true">·</span>
    <a href="/ui/chat/" data-i18n="welcome.11" data-zh="对话" data-en="Conversation">对话</a>
    <span aria-hidden="true">·</span>
    <a href="/legacy" data-i18n="welcome.12" data-zh="旧版界面" data-en="Legacy GUI">旧版界面</a>
  </footer>
</body>
</html>
