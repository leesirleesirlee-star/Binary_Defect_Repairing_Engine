name: build-fixture

on:
  push:
    branches: [m3/stack-overflow-01]
    paths:
      - "fixtures/stack-overflow-01/**"
      - "tests/fixture/**"
      - ".github/workflows/build-fixture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gcc binutils
      - run: python -m pip install pyelftools capstone
      - name: Build twice and record manifest
        shell: bash
        run: |
          set +e
          cd fixtures/stack-overflow-01
          {
            echo "== toolchain =="
            gcc --version | head -1
            ld --version | head -1
            uname -a
            echo "== build 1 =="
            chmod +x build/build.sh
            ./build/build.sh
            first=$(sha256sum vuln.elf | cut -d' ' -f1)
            cp vuln.elf /tmp/vuln-first.elf
            echo "first=$first"
            echo "== build 2 =="
            ./build/build.sh
            second=$(sha256sum vuln.elf | cut -d' ' -f1)
            echo "second=$second"
            test "$first" = "$second"
            echo "== manifest =="
            python3 build/record_manifest.py --fixture . --second-sha256 "$second"
          } > build/ci-build.txt 2>&1
          status=$?
          cat build/ci-build.txt
          exit $status
      - name: Fixture tests
        run: python -m pytest -q tests/fixture
      - name: Commit built artifact
        shell: bash
        run: |
          set -eu
          if git diff --quiet -- fixtures/stack-overflow-01; then
            echo "artifact already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/stack-overflow-01/vuln.elf \
                  fixtures/stack-overflow-01/manifest.json \
                  fixtures/stack-overflow-01/contract.json \
                  fixtures/stack-overflow-01/SHA256SUMS
          git commit -m "chore(fixture): build x86-64 vuln.elf [skip ci]"
          git push
      - name: Record build failure log
        if: failure()
        shell: bash
        run: |
          set -eu
          if [ ! -f fixtures/stack-overflow-01/build/ci-build.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/stack-overflow-01/build/ci-build.txt
          git commit -m "chore(fixture): record build failure [skip ci]"
          git push



